<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>RSS News Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1E6D0;--paper:#FBF6EA;--ink:#3B2518;--brown:#7A4A2B;--mu:#8A6F5A;--ln:#D9C7A6;--c1:#D9573B;--c2:#2F8F83;--c3:#E0A52B;--fh:'Playfair Display',Georgia,serif;--fb:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);background-image:radial-gradient(#d9c7a688 1px,transparent 1px);background-size:18px 18px;color:var(--ink);font-family:var(--fb);line-height:1.55;overflow-x:hidden}
[hidden]{display:none!important}
.wrap{width:min(820px,100% - 2rem);margin-inline:auto;padding-block:1.5rem 3rem}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px;border-radius:4px}
h1{font-family:var(--fh);font-weight:900;font-size:clamp(2rem,1rem + 5vw,3.4rem);line-height:1;margin:0 0 .3rem}
h1 span{display:inline-block;background:var(--brown);color:var(--paper);font-size:.4em;padding:.15em .5em;vertical-align:middle;margin-left:.3em;letter-spacing:.05em}
h2{font-family:var(--fh);font-size:1.5rem;margin:2rem 0 .8rem;border-bottom:2px solid var(--brown);padding-bottom:.3rem}
.sub{color:var(--mu);margin:0 0 1.2rem}
.box{background:var(--paper);border:1px solid var(--ln);border-top:6px solid var(--c2);border-radius:6px;padding:1.3rem;box-shadow:5px 5px 0 var(--ln)}
label{display:block;font-weight:700;font-size:.9rem;margin:0 0 .25rem;color:var(--brown)}
label i{color:var(--c1);font-style:normal}
input[type=text],input[type=password],select,textarea{width:100%;font:inherit;padding:.65em .85em;border:2px solid var(--ln);border-radius:6px;background:#fff9;color:var(--ink);margin-bottom:.9rem}
input[type=file]{margin-bottom:.9rem;max-width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 1rem}
.btn{font:inherit;font-weight:700;background:var(--brown);color:var(--paper);border:0;padding:.7em 1.4em;border-radius:999px;cursor:pointer}
.btn.alt{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.btn.red{background:var(--c1)}
.btn.sm{padding:.3em .9em;font-size:.85rem}
.msg{margin:.7rem 0 0;font-weight:700;color:var(--c1)}.msg.ok{color:var(--c2)}
.note{margin:0 0 1rem;padding:.6rem .9rem;background:#E0A52B33;border-left:5px solid var(--c3);font-size:.92rem}
#pv{max-width:260px;border-radius:4px;display:block;margin:-.4rem 0 .9rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.it{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.7rem 0;border-bottom:1px solid var(--ln)}
.it b{font-family:var(--fh)}.it small{color:var(--mu);display:block}
.cm{width:100%;padding:.4rem 0 .4rem .8rem;border-left:3px solid var(--ln);display:flex;justify-content:space-between;gap:.6rem;align-items:center}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>RSS News <span>EDITOR</span></h1><p class="sub">2K26-27 · Student editors only</p></div><button class="btn alt sm" id="out" hidden>Sign out</button></div>

<div class="box" id="login">
<form id="lf"><label for="pw">Editor password</label>
<input type="password" id="pw" autocomplete="current-password">
<button class="btn" type="submit">Unlock editor</button>
<p class="msg" id="lm"></p></form>
</div>

<div id="app" hidden>
<p class="note" id="demo" hidden>Demo mode: Firebase is not connected yet, so nothing is saved. Connect it in ../config.js.</p>
<div class="box">
<h2 style="margin-top:0" id="ft">Write a story</h2>
<div class="row"><div><label for="wn">Written by <i>*</i></label><input type="text" id="wn" maxlength="50" placeholder="Editor name"></div>
<div><label for="wc">Category</label><select id="wc"><option>School</option><option>Class 10</option></select></div></div>
<label for="wt">Headline <i>*</i></label><input type="text" id="wt" maxlength="140">
<label for="wb">Story <i>*</i></label><textarea id="wb" rows="8" placeholder="Write the story. Press Enter for a new paragraph."></textarea>
<label for="wi">Thumbnail picture</label><input type="file" id="wi" accept="image/*"><img id="pv" alt="" hidden>
<label for="wf">Attach files (each up to 700 KB)</label><input type="file" id="wf" multiple>
<button class="btn" id="pub" type="button">Publish story</button> <button class="btn alt" id="cn" type="button" hidden>Cancel editing</button>
<p class="msg" id="pm"></p>
</div>
<h2>Published stories</h2>
<div id="ls"></div>
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../config.js"></script>
<script>
(function(){
var R=window.RSS||{},ok=!!(R.firebase&&R.firebase.apiKey&&!/PASTE/i.test(R.firebase.apiKey)&&window.firebase),db;
if(ok){firebase.initializeApp(R.firebase);db=firebase.firestore()}
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var thumb='',editing=null;
function show(on){$('login').hidden=on;$('app').hidden=!on;$('out').hidden=!on;$('demo').hidden=ok;if(on)loadList()}
var LOCK='yaapaaram';
$('lf').addEventListener('submit',function(e){e.preventDefault();var pw=$('pw').value;$('lm').textContent='';if(pw!==LOCK){$('lm').textContent='Wrong password.';return}$('pw').value='';try{sessionStorage.setItem('rssEd','1')}catch(x){}show(true)});
$('out').addEventListener('click',function(){try{sessionStorage.removeItem('rssEd')}catch(x){}show(false)});
try{if(sessionStorage.getItem('rssEd')==='1')show(true)}catch(x){}
function shrink(f,max,q){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function rd(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(f)})}
$('wi').addEventListener('change',function(){var f=this.files[0];if(!f)return;shrink(f,900,.75).then(function(d){thumb=d;$('pv').src=d;$('pv').hidden=false}).catch(function(){say('Could not read that picture.')})});
$('wf').addEventListener('change',function(){for(var i=0;i<this.files.length;i++)if(this.files[i].size>700000){say('"'+this.files[i].name+'" is over 700 KB. Pick a smaller file.');this.value='';return}say('')});
function say(t,g){var m=$('pm');m.textContent=t;m.className='msg'+(g?' ok':'')}
function reset(){editing=null;thumb='';['wn','wt','wb'].forEach(function(i){$(i).value=''});$('wi').value='';$('wf').value='';$('pv').hidden=true;$('ft').textContent='Write a story';$('pub').textContent='Publish story';$('cn').hidden=true}
$('cn').addEventListener('click',function(){reset();say('')});
$('pub').addEventListener('click',async function(){
var a=$('wn').value.trim(),t=$('wt').value.trim(),b=$('wb').value.trim();
if(!a){say('Writer name is required.');return}
if(!t||!b){say('Please add a headline and the story.');return}
if(!ok){say('Demo mode: nothing was saved.');return}
var btn=this;btn.disabled=true;say('Publishing...',1);
try{
var data={title:t,body:b,author:a,category:$('wc').value};
if(thumb)data.thumb=thumb;
var id=editing;
if(id){await db.collection('stories').doc(id).update(data)}
else{data.created=firebase.firestore.FieldValue.serverTimestamp();data.thumb=data.thumb||'';id=(await db.collection('stories').add(data)).id}
var fs=$('wf').files;
for(var i=0;i<fs.length;i++){await db.collection('stories').doc(id).collection('files').add({name:fs[i].name,data:await rd(fs[i])})}
reset();say('Published!',1);loadList()
}catch(e){say('Could not save. Check that the Firebase rules are set.')}
btn.disabled=false});
function loadList(){
var L=$('ls');L.innerHTML='';
if(!ok){L.appendChild(el('p','sub','Published stories will show here once Firebase is connected.'));return}
db.collection('stories').orderBy('created','desc').get().then(function(q){
if(q.empty)L.appendChild(el('p','sub','No stories yet.'));
q.forEach(function(d){var s=d.data(),row=el('div','it'),l=el('div'),bb=el('div');
l.appendChild(el('b','',s.title));
var dt=s.created&&s.created.toDate?s.created.toDate().toLocaleDateString('en-GB'):'';
l.appendChild(el('small','',(s.category||'')+' · By '+(s.author||'')+' · '+dt));
var e=el('button','btn alt sm','Edit'),c=el('button','btn alt sm','Comments'),x=el('button','btn red sm','Delete');
[e,c,x].forEach(function(z){z.type='button';z.style.marginLeft='.4rem';bb.appendChild(z)});
row.appendChild(l);row.appendChild(bb);var cb=el('div');cb.hidden=true;row.appendChild(cb);L.appendChild(row);
e.addEventListener('click',function(){editing=d.id;thumb='';$('wn').value=s.author||'';$('wc').value=s.category||'School';$('wt').value=s.title;$('wb').value=s.body;$('wi').value='';$('wf').value='';
if(s.thumb){$('pv').src=s.thumb;$('pv').hidden=false}else $('pv').hidden=true;
$('ft').textContent='Edit story';$('pub').textContent='Update story';$('cn').hidden=false;say('');window.scrollTo(0,0)});
c.addEventListener('click',function(){cb.hidden=!cb.hidden;if(cb.hidden)return;cb.innerHTML='';
db.collection('stories').doc(d.id).collection('comments').orderBy('created','asc').get().then(function(cq){
if(cq.empty)cb.appendChild(el('p','sub','No comments.'));
cq.forEach(function(cd){var k=cd.data(),w=el('div','cm'),tx=el('span','',k.name+': '+k.text),dl=el('button','btn red sm','Delete');dl.type='button';
dl.addEventListener('click',function(){cd.ref.delete().then(function(){w.remove()})});w.appendChild(tx);w.appendChild(dl);cb.appendChild(w)})})});
x.addEventListener('click',async function(){
if(!confirm('Delete this story and its comments?'))return;
try{var r=db.collection('stories').doc(d.id);
for(var sub of ['comments','files']){var qq=await r.collection(sub).get();for(var dd of qq.docs)await dd.ref.delete()}
await r.delete();loadList()}catch(er){say('Could not delete.')}})})}).catch(function(){L.appendChild(el('p','msg','Could not load stories.'))})}
})();
</script>
</body>
</html>
